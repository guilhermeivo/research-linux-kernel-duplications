<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
body {
    font-family: "JetBrains Mono";
    color: #24292f;
    background: #ffffff;
}

pre,
code {
    font-family: "JetBrains Mono";
    color: #24292f;
}

.window {
    width: 350px;
    border-radius: 12px;
    overflow: hidden;
    background: #ffffff;
    border: 1px solid #d0d7de;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
}

.titlebar {
    height: 38px;
    background: #f6f8fa;
    border-bottom: 1px solid #d8dee4;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 15px;
}

.buttons {
    display: flex;
    gap: 8px;
}

.buttons span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}

.red {
    background: #ff5f57;
}

.editor {
    background: #ffffff;
    color: #24292f;
    font-family: "JetBrains Mono", monospace;
    font-size: 15px;
    line-height: 1.5;
    padding: 16px;
    padding-top: 0;
    border-radius: 8px;
}

.keyword {
    color: #cf222e;
}

.type {
    color: #8250df;
}

.function {
    color: #0969da;
}

.variable {
    color: #24292f;
}

.number {
    color: #0550ae;
}

.string {
    color: #914417;
}

.comment {
    color: #6e7781;
    font-style: italic;
}

.highlight {
    background: rgba(255, 0, 0, 0.12);
}

.dark-highlight {
    background: rgba(255, 0, 0, 0.56);
}

.red-text {
    color: #cf222e;
}

.secondary {
    color: #8c959f;
}

.green-text {
    color: #1a7f37;
}

.line-green {
    background: rgba(26, 127, 55, 0.12);
}

.line-dark-green {
    background: rgba(26, 127, 55, 0.56);
}
    </style>
</head>
