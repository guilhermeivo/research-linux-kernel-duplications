name: Build PDFs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = build-YYYYMMDD-HHMM)"
        required: false
        default: ""
      draft:
        description: "Create the release as a draft (visible only to collaborators)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile final report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: docs/final-report

      - name: Collect PDFs
        run: |
          mkdir -p dist
          cp docs/final-report/main.pdf dist/final-report.pdf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/*.pdf
          retention-days: 30

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          TAG="${INPUT_TAG:-build-$(date -u +%Y%m%d-%H%M)}"
          FLAGS=""
          if [ "$DRAFT" = "true" ]; then FLAGS="--draft"; fi

          gh release create "$TAG" dist/*.pdf $FLAGS \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --notes "PDFs built from commit $GITHUB_SHA."
